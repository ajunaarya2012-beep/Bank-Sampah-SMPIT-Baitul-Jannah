<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Sampah SMPIT Baitul Jannah</title>
<style>
:root{--bg:#f3f8f1;--card:#fff;--ink:#17301f;--mut:#5d7565;--pri:#1f8a4c;--pri2:#e6f4ea;--line:#d9e6dc;--red:#c0392b;--gold:#b8860b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a13;--card:#16251b;--ink:#e6f2ea;--mut:#9bb5a4;--pri:#3dbd73;--pri2:#1c3426;--line:#2a4333;--red:#ef7a6c;--gold:#e0b84a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:relative;background:linear-gradient(135deg,#145c33,#1f8a4c);color:#fff;padding:22px 84px 18px;text-align:center}
.logo{position:absolute;top:12px;right:14px;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(max-width:520px){header{padding:16px 70px 14px 14px}header h1{font-size:1.25rem}.logo{width:52px;height:52px;top:10px;right:10px}}
header small{letter-spacing:.14em;opacity:.85;font-weight:600}
header h1{margin:4px 0 2px;font-size:1.55rem}
header p{margin:0;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--mut);padding:9px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 12px 40px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}
.stat span{color:var(--mut);font-size:.85rem}
h2{font-size:1.1rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.del{background:transparent;color:var(--red);padding:4px 8px;margin:0;font-size:.85rem}
.btn.ed{background:transparent;color:var(--pri);padding:4px 8px;margin:0;font-size:.85rem}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:8px;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:.78rem;text-transform:uppercase}
.in{color:var(--pri);font-weight:700}.out{color:var(--gold);font-weight:700}
.est{background:var(--pri2);color:var(--pri);padding:8px 10px;border-radius:10px;margin-top:10px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
#banner{width:calc(100% - 24px);max-width:956px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:var(--pri2);color:var(--pri);font-weight:600;font-size:.9rem}
#banner:empty{display:none}
#banner.bad{background:transparent;border:1px solid var(--red);color:var(--red)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 12px 24px}
</style>
</head>

 if(shown==tab){for(var k in keep){var e=document.getElementById(k);if(e)e.value=keep[k]}if(fid){var f=document.getElementById(fid);if(f)f.focus()}}
 shown=tab;
 if(tab=="riwayat")list();if(tab=="transaksi")sal();
}
function vRingkasan(){
 var kg=0,sal=0,bln=0,m=today().slice(0,7);
 D.tx.forEach(function(t){if(t.jenis=="setor"){kg+=t.kg;sal+=t.nilai;if(t.tgl.slice(0,7)==m)bln++}else sal-=t.nilai});
 var top=D.siswa.map(function(s){var x=stat(s.id);return{s:s,kg:x.kg,sal:x.sal}}).filter(function(x){return x.kg>0}).sort(function(a,b){return b.kg-a.kg}).slice(0,5);
 var rec=D.tx.slice().reverse().slice(0,5);
 return '<div class="grid"><div class="card stat"><b>'+D.siswa.length+'</b><span>Siswa terdaftar</span></div><div class="card stat"><b>'+kg.toFixed(1)+' kg</b><span>Total sampah terkumpul</span></div><div class="card stat"><b>'+rp(sal)+'</b><span>Total saldo siswa</span></div><div class="card stat"><b>'+bln+'</b><span>Setoran bulan ini</span></div></div>'+
 (D.siswa.length?'':'<div class="card"><b>Selamat datang!</b> Mulai dengan menambahkan data siswa di tab <a href="#" onclick="go(\'siswa\');return false">Siswa</a>, lalu atur jenis sampah dan harga di tab <a href="#" onclick="go(\'sampah\');return false">Jenis &amp; Harga</a>.</div>')+
 '<div class="two"><div class="card"><h2>🏆 Siswa terajin</h2>'+(top.length?'<div class="tw"><table><tr><th>Nama</th><th>Berat</th><th>Saldo</th></tr>'+top.map(function(x){return '<tr><td>'+esc(x.s.nama)+' ('+esc(x.s.kelas)+')</td><td>'+x.kg.toFixed(1)+' kg</td><td>'+rp(x.sal)+'</td></tr>'}).join("")+'</table></div>':'<div class="empty">Belum ada setoran.</div>')+'</div>'+
 '<div class="card"><h2>🕒 Transaksi terbaru</h2>'+(rec.length?'<div class="tw"><table>'+rec.map(function(t){return '<tr><td>'+tgl(t.tgl)+'</td><td>'+esc(name(t.sid))+'</td><td class="'+(t.jenis=="setor"?"in":"out")+'">'+(t.jenis=="setor"?"+":"−")+rp(t.nilai)+'</td></tr>'}).join("")+'</table></div>':'<div class="empty">Belum ada transaksi.</div>')+'</div></div>';
}
function vTransaksi(){
 if(!D.siswa.length||!D.harga.length)return '<div class="card empty">'+(!D.siswa.length?'Tambahkan siswa terlebih dahulu di tab <a href="#" onclick="go(\'siswa\');return false">Siswa</a>. ':'')+(!D.harga.length?'Tambahkan jenis sampah di tab <a href="#" onclick="go(\'sampah\');return false">Jenis &amp; Harga</a>.':'')+'</div>';
 return '<div class="two"><div class="card"><h2>➕ Setor sampah</h2><label>Siswa</label><select id="s1">'+opts()+'</select><label>Jenis sampah</label><select id="k1" onchange="est()">'+D.harga.map(function(h){return '<option value="'+h.id+'">'+esc(h.nama)+' — '+rp(h.harga)+'/kg</option>'}).join("")+'</select><label>Berat (kg)</label><input id="b1" type="number" min="0" step="0.1" placeholder="0.0" oninput="est()"><label>Tanggal</label><input id="t1" type="date" value="'+today()+'"><div class="est" id="est">Estimasi nilai: Rp0</div><button class="btn" onclick="setor()">Simpan setoran</button></div>'+
 '<div class="card"><h2>💸 Tarik saldo</h2><label>Siswa</label><select id="s2" onchange="sal()">'+opts()+'</select><div class="est" id="sal"></div><label>Jumlah penarikan (Rp)</label><input id="j2" type="number" min="0" step="500" placeholder="0"><label>Tanggal</label><input id="t2" type="date" value="'+today()+'"><button class="btn alt" onclick="tarik()">Catat penarikan</button></div></div>';
}
function est(){var b=parseFloat(document.getElementById("b1").value)||0,h=jenis(document.getElementById("k1").value);document.getElementById("est").textContent="Estimasi nilai: "+rp(b*(h?h.harga:0))}
function sal(){var e=document.getElementById("sal");if(e)e.textContent="Saldo tersedia: "+rp(stat(document.getElementById("s2").value).sal)}
function setor(){var sid=document.getElementById("s1").value,h=jenis(document.getElementById("k1").value),b=parseFloat(document.getElementById("b1").value),t=document.getElementById("t1").value;
 if(!h||!(b>0)||!t){toast("Isi berat dan tanggal dengan benar");return}
 document.getElementById("b1").value="";
 run(addDoc(C.t,{tgl:t,sid:sid,jenis:"setor",kat:h.nama,kg:b,nilai:b*h.harga,ts:Date.now()}),"Setoran tersimpan ✔")}
function tarik(){var sid=document.getElementById("s2").value,j=parseFloat(document.getElementById("j2").value),t=document.getElementById("t2").value;
 if(!(j>0)||!t){toast("Isi jumlah dan tanggal dengan benar");return}
 if(j>stat(sid).sal){toast("Saldo tidak mencukupi");return}
 document.getElementById("j2").value="";
 run(addDoc(C.t,{tgl:t,sid:sid,jenis:"tarik",kat:"Penarikan saldo",kg:0,nilai:j,ts:Date.now()}),"Penarikan dicatat ✔")}
function vSiswa(){
 return '<div class="card"><h2>👩‍🎓 Tambah siswa</h2><div class="two"><div><label>Nama lengkap</label><input id="n"></div><div><label>Kelas</label><input id="c" placeholder="contoh: 7A"></div></div><button class="btn" onclick="addS()">Tambah siswa</button></div>'+
 '<div class="card"><h2>Daftar siswa</h2>'+(D.siswa.length?'<div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Total setor</th><th>Saldo</th><th></th></tr>'+D.siswa.map(function(s){var x=stat(s.id);return '<tr><td>'+esc(s.nama)+'</td><td>'+esc(s.kelas)+'</td><td>'+x.kg.toFixed(1)+' kg</td><td class="in">'+rp(x.sal)+'</td><td><button class="btn ed" onclick="edS(\''+s.id+'\')">Ubah</button><button class="btn del" onclick="delS(\''+s.id+'\')">Hapus</button></td></tr>'}).join("")+'</table></div>':'<div class="empty">Belum ada siswa. Tambahkan lewat formulir di atas.</div>')+'</div>';
}
function addS(){var n=document.getElementById("n").value.trim(),c=document.getElementById("c").value.trim();if(!n||!c){toast("Nama dan kelas wajib diisi");return}
 document.getElementById("n").value="";document.getElementById("c").value="";
 run(addDoc(C.s,{nama:n,kelas:c.toUpperCase(),ts:Date.now()}),"Siswa ditambahkan ✔")}
function edS(id){var s=D.siswa.find(function(x){return x.id==id}),n=prompt("Nama siswa:",s.nama);if(n===null)return;var c=prompt("Kelas:",s.kelas);if(c===null)return;
 if(!n.trim()||!c.trim()){toast("Nama dan kelas tidak boleh kosong");return}
 run(updateDoc(doc(db,"siswa",id),{nama:n.trim(),kelas:c.trim().toUpperCase()}),"Data siswa diperbarui ✔")}
async function delMany(refs){for(var i=0;i<refs.length;i+=400){var b=writeBatch(db);refs.slice(i,i+400).forEach(function(r){b.delete(r)});await b.commit()}}
function delS(id){if(!confirm("Hapus siswa ini beserta seluruh transaksinya?"))return;
 var refs=[doc(db,"siswa",id)].concat(D.tx.filter(function(t){return t.sid==id}).map(function(t){return doc(db,"transaksi",t.id)}));
 run(delMany(refs),"Siswa dihapus")}
function vSampah(){
 return '<div class="card"><h2>🏷️ Jenis sampah &amp; harga per kg</h2><p style="color:var(--mut);margin-top:0">Ubah nama atau harga langsung pada kolomnya. Perubahan harga hanya berlaku untuk setoran berikutnya; transaksi lama tidak berubah.</p>'+
 (D.harga.length?D.harga.map(function(h){return '<div class="row"><input value="'+esc(h.nama)+'" onchange="upH(\''+h.id+'\',\'nama\',this.value)"><input type="number" min="0" step="100" value="'+h.harga+'" onchange="upH(\''+h.id+'\',\'harga\',this.value)"><button class="btn del" onclick="delH(\''+h.id+'\')">Hapus</button></div>'}).join(""):'<div class="empty">Belum ada jenis sampah.</div>')+'</div>'+
 '<div class="card"><h2>➕ Tambah jenis sampah</h2><div class="two"><div><label>Nama jenis sampah</label><input id="hn" placeholder="contoh: Minyak jelantah"></div><div><label>Harga per kg (Rp)</label><input id="hh" type="number" min="0" step="100"></div></div><button class="btn" onclick="addH()">Tambah jenis</button></div>';
}
function upH(id,f,v){if(f=="nama"){v=v.trim();if(!v){toast("Nama tidak boleh kosong");render();return}}else v=Math.max(0,parseFloat(v)||0);var o={};o[f]=v;run(updateDoc(doc(db,"jenisSampah",id),o),"Tersimpan ✔")}
function addH(){var n=document.getElementById("hn").value.trim(),p=parseFloat(document.getElementById("hh").value);if(!n||!(p>=0)){toast("Isi nama dan harga");return}
 document.getElementById("hn").value="";document.getElementById("hh").value="";
 run(addDoc(C.h,{nama:n,harga:p}),"Jenis sampah ditambahkan ✔")}
function delH(id){if(!confirm("Hapus jenis sampah ini? Riwayat transaksi lama tetap tersimpan."))return;run(deleteDoc(doc(db,"jenisSampah",id)),"Jenis sampah dihapus")}
function vRiwayat(){return '<div class="card"><h2>📒 Riwayat transaksi</h2><input id="q" placeholder="Cari nama siswa atau jenis sampah…" value="'+esc(q)+'" oninput="setQ(this.value)"><div id="lst" style="margin-top:10px"></div><button class="btn alt" onclick="reset()">Hapus semua siswa &amp; transaksi</button></div>'}
function setQ(v){q=v;list()}
function list(){var l=D.tx.slice().reverse().filter(function(t){return (name(t.sid)+" "+t.kat).toLowerCase().indexOf(q.toLowerCase())>-1});
 document.getElementById("lst").innerHTML=l.length?'<div class="tw"><table><tr><th>Tanggal</th><th>Siswa</th><th>Keterangan</th><th>Berat</th><th>Nilai</th><th></th></tr>'+l.map(function(t){return '<tr><td>'+tgl(t.tgl)+'</td><td>'+esc(name(t.sid))+'</td><td>'+esc(t.kat)+'</td><td>'+(t.kg?t.kg.toFixed(1)+' kg':'–')+'</td><td class="'+(t.jenis=="setor"?"in":"out")+'">'+(t.jenis=="setor"?"+":"−")+rp(t.nilai)+'</td><td><button class="btn del" onclick="delT(\''+t.id+'\')">Hapus</button></td></tr>'}).join("")+'</table></div>':'<div class="empty">Tidak ada transaksi.</div>'}
function delT(id){run(deleteDoc(doc(db,"transaksi",id)),"Transaksi dihapus")}
function reset(){if(!confirm("SEMUA data siswa dan transaksi akan dihapus permanen dari Firestore (jenis sampah & harga tetap). Lanjutkan?"))return;
 run(delMany(D.siswa.map(function(x){return doc(db,"siswa",x.id)}).concat(D.tx.map(function(x){return doc(db,"transaksi",x.id)}))),"Data dihapus")}
Object.assign(window,{go:go,est:est,sal:sal,setor:setor,tarik:tarik,addS:addS,edS:edS,delS:delS,addH:addH,upH:upH,delH:delH,setQ:setQ,delT:delT,reset:reset});
render();
</script>
</body>
</html>
